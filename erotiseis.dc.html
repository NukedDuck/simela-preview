  [data-q] [data-qm] { background: var(--acc); color: var(--ink); transition: rotate 320ms cubic-bezier(.2,.7,.2,1), background-color 240ms ease, color 240ms ease; }
  [data-q]:hover { border-color: var(--acc) !important; }

  [data-q][aria-expanded="true"] [data-qt] { color: var(--ink); }
  [data-q][aria-expanded="true"] [data-qm] { background: #ffffff; color: var(--acc); rotate: 45deg; }

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const FAQ_A = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.';

const FAQ_QA = [
  ['Lorem ipsum dolor sit amet consectetur?', FAQ_A],
  ['Sed do eiusmod tempor incididunt ut labore?', FAQ_A],
  ['Ut enim ad minim veniam quis nostrud?', FAQ_A],
  ['Duis aute irure dolor in reprehenderit?', FAQ_A],
  ['Excepteur sint occaecat cupidatat non proident?', FAQ_A],
  ['Sunt in culpa qui officia deserunt mollit?', FAQ_A],
  ['Nemo enim ipsam voluptatem quia voluptas?', FAQ_A],
  ['Neque porro quisquam est qui dolorem ipsum?', FAQ_A],
  ['Quis autem vel eum iure reprehenderit qui?', FAQ_A]
];

class Component extends DCLogic {
  state = { m1: 1, m2: 4, m3: 7 };

  faqList(key, from, to) {
    return FAQ_QA.slice(from, to).map((row, i) => {
      const n = from + i + 1;
      return {
        q: row[0],
        a: row[1],
        on: this.state[key] === n ? 'true' : 'false',
        pick: () => this.setState({ [key]: n })
      };
    });
  }

  renderVals() {
    return {
      b1: this.faqList('m1', 0, 3),
      b2: this.faqList('m2', 3, 6),
      b3: this.faqList('m3', 6, 9)
    };
  }
}
</script>
